app:
  open-api:
    description: provisioning-service
    title: Provisioning Service
    version: 0.0.1-SNAPSHOT

github:
  api:
    base-url: https://api.github.com
    token: test-token
    org: test-org

atlassian:
  api:
    base-url: http://localhost
    email: test@example.com
    token: test-token

jwt:
  secret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

spring:
  kafka:
    properties:
      schema-registry-url: mock://test
    consumer:
      # Each test context starts its own listener; without this it can join after the
      # test has already published and skip the message (default is "latest").
      auto-offset-reset: earliest
